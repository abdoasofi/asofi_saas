{# Shared visual language for every page under /asofisaas — the platform
   page and each product storefront. Kept in one file so a product page
   cannot drift into looking like a different company. #}
<style>
  /* Palette taken from the marks themselves: every logo runs the same
     teal→blue gradient over a navy wordmark. Sampling them rather than
     inventing a palette is what makes the pages read as the same company as
     the app icons a customer already has on their phone. */
  :root {
    --teal: #17a89b;
    --blue: #1d4ed8;
    --blue-deep: #16357d;
    --brand: linear-gradient(135deg, var(--teal), var(--blue));

    --primary: #0f8a80;          /* solid stand-in where a gradient cannot go */
    --primary-dark: #12305a;     /* the navy of the wordmarks */
    --primary-soft: #e6f6f4;
    --accent: #17a89b;

    --ink: #12305a;
    --muted: #5b7089;
    --line: #e4ebf2;
    --bg: #f6f9fb;
    --ok: #16a34a;
    --err: #dc2626;

    --radius: 16px;
    /* Two layers: a tight one for edge definition, a wide soft one for lift.
       A single heavy shadow is what makes a page look like a template. */
    --shadow: 0 1px 2px rgba(18, 48, 90, .05), 0 12px 32px rgba(18, 48, 90, .07);
    --shadow-lg: 0 2px 4px rgba(18, 48, 90, .06), 0 24px 56px rgba(18, 48, 90, .12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .asofi-lp {
    font-family: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.85;
  }
  .asofi-lp .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .asofi-lp h1, .asofi-lp h2, .asofi-lp h3 { margin: 0 0 .4em; line-height: 1.3; }
  .asofi-lp p { margin: 0 0 1em; }
  .asofi-lp a { color: inherit; text-decoration: none; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    padding: 14px 28px; border-radius: 12px; font-weight: 700; font-size: 1rem;
    cursor: pointer; border: 2px solid transparent; transition: transform .06s ease, box-shadow .2s;
    font-family: inherit;
  }
  .btn:active { transform: translateY(1px); }
  .btn--primary { background: var(--brand); color: #fff; box-shadow: 0 8px 22px rgba(29, 78, 216, .26); }
  .btn--primary:hover { filter: saturate(1.12) brightness(.96); box-shadow: 0 12px 28px rgba(29, 78, 216, .32); }
  .btn--ghost { background: #fff; color: var(--primary-dark); border-color: var(--line); }
  .btn--ghost:hover { border-color: var(--teal); color: var(--teal); }
  .btn--lg { padding: 18px 40px; font-size: 1.15rem; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.9);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.4rem; color: var(--primary-dark); }
  .brand .dot { width: 34px; height: 34px; border-radius: 10px; background: var(--brand);
    display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 1rem; }

  /* The icon-only mark, derived from the master lockup by scripts/
     brand_assets.py. The full lockup cannot go here: it bakes in the name, the
     transliteration and a row of glyphs, all of which turn to mud at this size
     beside the name in text. `onerror` removes the <img> and leaves the .dot,
     so a missing asset degrades to the lettered badge rather than a broken
     image on a page whose job is to look credible. */
  .brand .mark { width: 34px; height: 34px; object-fit: contain; display: block; }
  .brand .mark + .dot { display: none; }

  /* Hero */
  /* Two tinted pools, one per brand end, kept faint. The gradient belongs on
     the mark and the call to action; behind a paragraph it competes with the
     words for attention and the words lose. */
  .hero { position: relative; overflow: hidden;
    background: radial-gradient(900px 420px at 88% -15%, rgba(23,168,155,.16), transparent 60%),
                radial-gradient(760px 380px at 8% 0%, rgba(29,78,216,.10), transparent 60%),
                linear-gradient(180deg, #fff, var(--bg)); }
  .hero .wrap { padding: 96px 20px 84px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 52px; align-items: center; }
  .hero .eyebrow { display: inline-flex; align-items: center; gap: 8px; background: #fff;
    border: 1px solid var(--line); color: var(--primary-dark);
    font-weight: 700; padding: 7px 16px; border-radius: 999px; font-size: .9rem; margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(18,48,90,.04); }
  .hero .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
  /* Fluid rather than a phone breakpoint: the headline is the one element
     that must never wrap into a stack of orphans on a mid-size screen. */
  .hero h1 { font-size: clamp(2rem, 1.2rem + 2.6vw, 3.15rem); letter-spacing: -.6px; line-height: 1.25; }
  .hero h1 span { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .lead { font-size: 1.2rem; color: var(--muted); max-width: 46ch; }
  .hero .cta-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 26px; }
  .hero .reassure { margin-top: 16px; color: var(--muted); font-size: .95rem; }
  .hero .reassure b { color: var(--ink); }
  .hero-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 22px; }
  .hero-card .row { display: flex; align-items: center; gap: 12px; padding: 12px 6px; border-bottom: 1px dashed var(--line); }
  .hero-card .row:last-child { border-bottom: 0; }
  .hero-card .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--primary-soft); color: var(--primary-dark);
    display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; flex: 0 0 auto; }
  .hero-card .row div b { display: block; }
  .hero-card .row div small { color: var(--muted); }

  /* Sections */
  section { padding: clamp(56px, 7vw, 92px) 0; }
  .section-head { text-align: center; max-width: 58ch; margin: 0 auto 48px; }
  .section-head h2 { font-size: clamp(1.6rem, 1.15rem + 1.5vw, 2.3rem); letter-spacing: -.4px; }
  .section-head p { color: var(--muted); font-size: 1.08rem; }
  /* A short gradient rule under each section title — the one place the brand
     repeats down the page without shouting. */
  .section-head h2::after { content: ""; display: block; width: 54px; height: 3px; border-radius: 3px;
    background: var(--brand); margin: 14px auto 0; }

  /* Features */
  .features { background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 22px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 28px;
    box-shadow: var(--shadow); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: #d6e2ee; }
  .card .ic { width: 50px; height: 50px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.4rem; background: var(--primary-soft); color: var(--primary-dark); margin-bottom: 14px; }
  .card h3 { font-size: 1.25rem; }
  .card p { color: var(--muted); margin: 0; }

  /* Pricing */
  .plans { display: grid; gap: 20px; align-items: stretch; justify-content: center;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 265px)); }
  .plan { position: relative; background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px 22px; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .plan { transition: transform .18s ease, box-shadow .18s ease; }
  .plan:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  /* The recommended plan is marked by a gradient edge rather than a heavier
     box, so it leads without making its neighbours look broken. */
  .plan--featured { border-color: transparent; transform: translateY(-6px); box-shadow: var(--shadow-lg);
    background: linear-gradient(#fff, #fff) padding-box, var(--brand) border-box; border: 2px solid transparent; }
  .plan--featured:hover { transform: translateY(-9px); }
  .plan__ribbon { position: absolute; top: -13px; inset-inline-start: 22px; background: var(--accent); color: #fff;
    font-weight: 700; font-size: .8rem; padding: 5px 12px; border-radius: 999px; }
  .plan h3 { font-size: 1.3rem; }
  .plan__price { font-size: 1.9rem; font-weight: 800; color: var(--primary-dark); margin: 6px 0 4px; }
  .plan__price span { font-size: .9rem; font-weight: 600; color: var(--muted); }
  .plan__desc { color: var(--muted); font-size: .92rem; min-height: 3em; }
  .plan__features { list-style: none; padding: 0; margin: 16px 0 22px; }
  .plan__features li { padding: 7px 0; border-bottom: 1px dashed var(--line); display: flex; align-items: center; gap: 8px; font-size: .95rem; }
  .plan__features li::before { content: "✓"; color: var(--ok); font-weight: 800; }
  /* The modules block carries the flex growth so every card's call-to-action
     lines up, however many modules a tier happens to include. */
  .plan__modules { flex: 1; display: flex; flex-direction: column; }
  .plan__modules-title { font-size: .78rem; font-weight: 700; color: var(--muted);
    letter-spacing: .02em; text-transform: none; }
  .plan__features--modules { margin: 8px 0 0; }
  .plan__features--modules li { font-size: .88rem; padding: 5px 0; border-bottom: 0; }
  .plan__contact { display: block; text-align: center; margin-top: 8px; font-size: .88rem;
    color: var(--primary-dark); text-decoration: none; font-weight: 700; }
  .plan__contact:hover { text-decoration: underline; }
  .chosen-plan { margin-top: 10px; font-weight: 700; color: var(--primary-dark); }

  /* Trial form */
  .trial { background: linear-gradient(180deg, var(--bg), #fff); }
  .trial-box { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid var(--line);
    border-radius: 20px; box-shadow: var(--shadow); padding: 34px; }
  .notice { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 700; margin-bottom: 7px; }
  .field input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px;
    font-family: inherit; font-size: 1rem; background: #fff; transition: border-color .15s, box-shadow .15s; }
  .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .subdomain-wrap { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .subdomain-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .subdomain-wrap input { border: 0; border-radius: 0; box-shadow: none; flex: 1; text-align: left; direction: ltr; }
  .subdomain-wrap .suffix { display: inline-flex; align-items: center; padding: 0 14px; background: var(--bg);
    color: var(--muted); font-weight: 600; direction: ltr; border-inline-start: 1px solid var(--line); }
  .hint { font-size: .88rem; margin-top: 6px; min-height: 1.2em; color: var(--muted); }
  .hint.ok { color: var(--ok); } .hint.err { color: var(--err); } .hint.checking { color: var(--muted); }
  .form-error { background: #fef2f2; border: 1px solid #fecaca; color: var(--err); border-radius: 11px; padding: 12px 14px; margin-bottom: 16px; display: none; }
  .form-error.show { display: block; }

  /* Progress panel */
  .provisioning { display: none; }
  .provisioning.show { display: block; }
  .form-view.hide { display: none; }
  .progress-track { height: 12px; background: var(--bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .5s ease; }
  .progress-pct { text-align: center; font-weight: 800; font-size: 1.4rem; color: var(--primary-dark); margin: 14px 0 4px; }
  .progress-step { text-align: center; color: var(--muted); margin-bottom: 18px; }
  .log { background: #0b1220; color: #cbd5e1; border-radius: 12px; padding: 14px; max-height: 220px; overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; direction: ltr; text-align: left; }
  .log div { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
  .log .info { color: #7dd3fc; } .log .progress { color: #94a3b8; } .log .success { color: #86efac; } .log .error { color: #fca5a5; }
  .result { text-align: center; padding: 8px; display: none; }
  .result.show { display: block; }
  .result .big-ic { font-size: 3rem; }
  .result .btn { display: flex; width: 100%; margin-top: 12px; }
  .login-info { text-align: right; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 16px; margin: 16px 0; }
  .login-info__row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
    border-bottom: 1px dashed var(--line); font-size: .95rem; }
  .login-info__row:last-child { border-bottom: 0; }
  .login-info__row span { color: var(--muted); }
  .login-info__row b { direction: ltr; word-break: break-all; text-align: left; }
  .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%;
    display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer */
  .site-footer { background: var(--primary-dark); color: #cbd5e1; padding: 40px 0; text-align: center; }
  .site-footer .brand { color: #fff; justify-content: center; margin-bottom: 8px; }

  @media (max-width: 900px) {
    .hero .wrap { grid-template-columns: 1fr; padding-top: 56px; }
    .hero-card { order: -1; }
    .hero h1 { font-size: 2.2rem; }
    .plan--featured { transform: none; }
  }
  @media (max-width: 560px) { .trial-box { padding: 22px; } }
</style>
